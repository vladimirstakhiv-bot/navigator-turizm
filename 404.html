<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Страница не найдена — Навигатор Туризм.РФ</title>
<style>
  :root{--ink:#0c131d;--ink-2:#5a6472;--blue:#0c73fe;--canvas:#f6f7f9}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--canvas);color:var(--ink);
       font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;padding:24px}
  .box{max-width:520px;text-align:center;background:#fff;border-radius:22px;padding:40px 32px}
  .code{font-size:64px;line-height:1;font-weight:800;letter-spacing:-.03em;margin:0}
  h1{font-size:22px;margin:12px 0 0}
  p{margin:10px 0 0;color:var(--ink-2);font-size:15px;line-height:1.5}
  a{display:inline-block;margin-top:22px;color:#fff;background:var(--blue);text-decoration:none;
    font-weight:700;font-size:15px;padding:12px 22px;border-radius:999px}
</style>
</head>
<body>
  <div class="box">
    <p class="code">404</p>
    <h1>Такой страницы нет</h1>
    <p>Возможно, ссылка устарела или в адресе опечатка.</p>
    <a href="/">Вернуться на главную</a>
  </div>
</body>
</html>
